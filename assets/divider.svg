<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" fill="none" role="img" aria-labelledby="t d"><title id="t">Divider</title><desc id="d">Section divider</desc><defs><style>
.fi{animation:fi .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes grow{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fi,.grow,.blink,.pulse,.spin{animation:none!important}}
</style><linearGradient id="dv1" gradientUnits="userSpaceOnUse" x1="0" x2="220"><stop offset="0" stop-color="#FF7A3D" stop-opacity="0"/><stop offset=".5" stop-color="#FFB25C"/><stop offset="1" stop-color="#FF7A3D" stop-opacity="0"/></linearGradient></defs><rect x="0" y="13.5" width="900" height="1" fill="#1E222B"/><rect x="-220" y="13" width="220" height="2" fill="url(#dv1)"><animate attributeName="x" values="-220;900;900" keyTimes="0;.7;1" dur="6s" repeatCount="indefinite"/></rect><rect x="446.0" y="10" width="8" height="8" rx="1.5" transform="rotate(45 450.0 14)" fill="#0E1016" stroke="#5D636F"/></svg>