name: Refresh profile

# Daily: pull GitHub activity, re-render the SVG cards and regenerate the contribution snake.
# Also runs when the content or build script changes, and on demand from the Actions tab.
on:
  schedule:
    - cron: "37 3 * * *" # 09:07 IST
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only. Add a PROFILE_TOKEN secret (classic PAT, read:user)
      # if you want private contributions counted as well.
      - name: Fetch stats and render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/build.py --fetch

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=#FF9A4D&color_dots=#1A1E26,#4A2614,#8A4520,#D0652A,#FF8A3D
            assets/generated/snake-light.svg?color_snake=#D9531A&color_dots=#EBEDF0,#FFD8BD,#FFB07A,#FF8A3D,#D9531A

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile cards"
            git pull --rebase --autostash
            git push
          fi
